<title id="title">Anatomy of lifecycle-policies.json</title>
<desc id="desc">The file has five parts: the $schema pin, Dublin Core metadata, a vocabulary of roles and events, one policy per document type, and an extensions object for your own keys. The policies are the heart of it.</desc>
