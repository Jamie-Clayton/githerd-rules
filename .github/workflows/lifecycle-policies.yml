# Conformance for the Lifecycle Policy Standard, authored in this repository
# under lifecycle-policies/.
#
# Every published version must:
#   - compile as JSON Schema 2020-12 in strict mode,
#   - pass its conformance examples under two independent validators (Ajv and
#     JsonSchema.Net) that agree example by example,
#   - map every Dublin Core term the standard defines through context.jsonld,
#   - never change after it is tagged lifecycle-policies-vX.Y.Z, from 1.0 on
#     (0.x versions are pre-releases for testing and may still change).
#
# The pages and explainer SVGs under lifecycle-policies/ must:
#   - link only to files that exist (internal links),
#   - carry a title and desc, and no script, event handlers or external
#     references (SVG check),
#   - match what .github/explainers generates (the SVGs are generated).
#
# The compliance rule pages elsewhere in this repository are mirrored from
# another repository by its own publish workflow, and are not checked here.

name: lifecycle-policies

on:
  pull_request:
    paths:
      - 'lifecycle-policies/**'
      - '.github/conformance/**'
      - '.github/explainers/**'
      - '.github/workflows/lifecycle-policies.yml'
      - 'LICENSE.md'
      - 'NOTICE'
  push:
    branches: [main]
    paths:
      - 'lifecycle-policies/**'
      - '.github/conformance/**'
      - '.github/explainers/**'
      - '.github/workflows/lifecycle-policies.yml'
      - 'LICENSE.md'
      - 'NOTICE'

permissions:
  contents: read

concurrency:
  group: lifecycle-policies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/conformance
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the immutability check diffs each release tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            .github/conformance/package-lock.json
            .github/explainers/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Licence files are present
        working-directory: .
        run: |
          test -s LICENSE.md || { echo "::error title=LICENSE.md missing::"; exit 1; }
          grep -q 'Apache License' LICENSE.md || { echo "::error title=LICENSE.md is not Apache-2.0::"; exit 1; }
          test -s NOTICE || { echo "::error title=NOTICE missing::"; exit 1; }

      - name: Install
        run: npm ci

      - name: Check tests
        run: node --test "test/*.test.mjs"

      - name: Conformance (Ajv, semantic rules, Dublin Core)
        run: node conformance.mjs --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/ajv-results.json"

      - name: Conformance (JsonSchema.Net)
        run: dotnet run --project dotnet/Conformance.csproj -c Release -- --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/dotnet-results.json"

      - name: The two validators agree
        run: node compare.mjs "$RUNNER_TEMP/ajv-results.json" "$RUNNER_TEMP/dotnet-results.json"

      - name: Released versions are unchanged
        run: node check-immutable.mjs --root "$GITHUB_WORKSPACE"

      - name: Explainer SVGs are safe and accessible
        run: node check-svg.mjs --root "$GITHUB_WORKSPACE"

      - name: Internal links resolve
        run: node check-links.mjs --root "$GITHUB_WORKSPACE"

      - name: Explainer SVGs match their generator
        working-directory: .github/explainers
        run: |
          npm ci
          node explainers.mjs --out "$RUNNER_TEMP/explainers"
          diff -r "$RUNNER_TEMP/explainers" "$GITHUB_WORKSPACE/lifecycle-policies/assets" || {
            echo "::error title=Explainer SVGs are stale::Regenerate with: node .github/explainers/explainers.mjs"
            exit 1
          }
